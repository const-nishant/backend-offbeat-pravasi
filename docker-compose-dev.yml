services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: offbeat-api-dev
    ports:
      - '4000:4000'
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env
    command: sh -c "npm install && npm run build && node dist/main"
