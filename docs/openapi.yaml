components:
  securitySchemes:
    access-token:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKey:
      type: apiKey
      in: header
      name: x-api-key

  schemas:
    # ── Base response ──
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object

    # ── Auth ──
    AuthenticatedUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        isAdmin:
          type: boolean
        organizerStatus:
          type: string
          nullable: true

    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer

    # ── Enums ──
    TrekDifficulty:
      type: string
      enum: [EASY, MODERATE, DIFFICULT, EXTREME]

    TrekStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CANCELLED, COMPLETED]

    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED, FAILED]

    BookingStatusFilter:
      type: string
      enum: [PENDING, CONFIRMED, CANCELLED, FAILED]

    PaymentProvider:
      type: string
      enum: [STRIPE, RAZORPAY]

    OrganizerStatus:
      type: string
      enum: [NONE, PENDING, APPROVED, REJECTED]

    Decision:
      type: string
      enum: [APPROVE, REJECT]

    TrekDecision:
      type: string
      enum: [APPROVE, REJECT]

    # ── DTOs ──
    CreateTrekDto:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 255
        shortDescription:
          type: string
          maxLength: 512
        fullDescription:
          type: string
        state:
          type: string
        location:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        difficulty:
          $ref: "#/components/schemas/TrekDifficulty"
        costInr:
          type: integer
          minimum: 0
        maxParticipants:
          type: integer
          minimum: 1
        tags:
          type: array
          items:
            type: string
        imageKeys:
          type: array
          items:
            type: string

    CreateBookingDto:
      type: object
      required: [trekId, quantity]
      properties:
        trekId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
        participants:
          type: array
          items:
            type: object
        contactPhone:
          type: string
        contactEmail:
          type: string
          format: email
        clientReference:
          type: string

    CreateCheckoutDto:
      type: object
      required: [bookingId, provider]
      properties:
        bookingId:
          type: string
          format: uuid
        provider:
          $ref: "#/components/schemas/PaymentProvider"
        idempotencyKey:
          type: string

    CreateOrganizerRequestDto:
      type: object
      required: [organizationName, contactPhone, bio]
      properties:
        organizationName:
          type: string
          minLength: 1
          maxLength: 160
        contactPerson:
          type: string
          maxLength: 160
        contactPhone:
          type: string
          minLength: 3
          maxLength: 20
        website:
          type: string
          format: uri
          maxLength: 160
        bio:
          type: string
        yearsOfExperience:
          type: integer
          minimum: 0
          example: 5
        documentUrls:
          type: object
          additionalProperties:
            type: string
            format: uri
          example:
            licence: "https://..."
        certificateUrls:
          type: object
          additionalProperties:
            type: string
            format: uri
          example:
            certificate: "https://..."

    UpdateOrganizerRequestDto:
      allOf:
        - $ref: "#/components/schemas/CreateOrganizerRequestDto"
        - type: object
          properties:
            status:
              $ref: "#/components/schemas/OrganizerStatus"
            adminNotes:
              type: string
              maxLength: 1000
            reviewedAt:
              type: string
              format: date-time

    UpdatePlatformSettingsDto:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          description: Arbitrary platform settings object
        message:
          type: string

    UpdateUserStatusDto:
      type: object
      properties:
        isSuspended:
          type: boolean
        organizerStatus:
          type: string
        note:
          type: string

    OrganizerRequestDecisionDto:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/Decision"
        note:
          type: string

    TrekDecisionDto:
      type: object
      required: [decision]
      properties:
        decision:
          $ref: "#/components/schemas/TrekDecision"
        note:
          type: string

    # ── Posts ──
    CreatePostDto:
      type: object
      required: [caption, imageUrls]
      properties:
        caption:
          type: string
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        location:
          type: string
          nullable: true

    CommentPostDto:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          maxLength: 500

    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
        caption:
          type: string
        imageUrls:
          type: array
          items:
            type: string
            format: uri
        location:
          type: string
          nullable: true
        likesCount:
          type: integer
        commentsCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
          nullable: true
        username:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          format: uri
          nullable: true

    # ── Stories ──
    CreateStoryDto:
      type: object
      required: [mediaUrl, mediaType]
      properties:
        mediaUrl:
          type: string
          format: uri
        mediaType:
          type: string
          description: Type of media (e.g., IMAGE, VIDEO)
        caption:
          type: string
          nullable: true

    Story:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
        mediaUrl:
          type: string
          format: uri
        mediaType:
          type: string
        caption:
          type: string
          nullable: true
        expiresAt:
          type: string
          format: date-time
        viewsCount:
          type: integer
        createdAt:
          type: string
          format: date-time
