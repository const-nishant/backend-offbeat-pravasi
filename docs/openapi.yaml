openapi: "3.0.3"
info:
  title: "Offbeat प्रवासी API"
  description: "Full-scale, production-ready trek discovery and booking platform."
  version: "1.0.0"
servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://api.offbeatpravasi.com
    description: Production

paths:
  # ──────────────────────────────────────────────
  # APP
  # ──────────────────────────────────────────────
  /:
    get:
      operationId: appHello
      summary: Health check / welcome
      tags: [App]
      responses:
        "200":
          description: Hello world string
          content:
            text/plain:
              schema:
                type: string

  # ──────────────────────────────────────────────
  # HEALTH
  # ──────────────────────────────────────────────
  /health:
    get:
      operationId: healthBase
      summary: Base health check
      tags: [Health]
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object

  /health/redis:
    get:
      operationId: healthRedis
      summary: Redis health check
      tags: [Health]
      responses:
        "200":
          description: Redis ping result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      pong:
                        type: string

  # ──────────────────────────────────────────────
  # AUTH
  # ──────────────────────────────────────────────
  /auth/register:
    post:
      operationId: authRegister
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 8
                  example: myPassword123
                fullName:
                  type: string
                  example: John Doe
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/login:
    post:
      operationId: authLogin
      summary: Login with email and password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  example: myPassword123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  data:
                    $ref: "#/components/schemas/TokenPair"

  /auth/email/send-otp:
    post:
      operationId: authSendOtp
      summary: Send email OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/email/verify-otp:
    post:
      operationId: authVerifyOtp
      summary: Verify email OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  pattern: ^\d{6}$
                  example: "123456"
      responses:
        "201":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/refresh:
    post:
      operationId: authRefresh
      summary: Refresh JWT token pair
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"

  /auth/logout:
    post:
      operationId: authLogout
      summary: Logout and invalidate session
      tags: [Auth]
      security:
        - access-token: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: authMe
      summary: Get current authenticated user
      tags: [Auth]
      security:
        - access-token: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/AuthenticatedUser"

  /auth/google:
    get:
      operationId: authGoogle
      summary: Initiate Google OAuth flow
      tags: [Auth]
      responses:
        "200":
          description: Google authorize URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri

  /auth/google/exchange:
    post:
      operationId: authGoogleExchange
      summary: Exchange Google OAuth session for JWT tokens
      tags: [Auth]
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: "#/components/schemas/TokenPair"

  /auth/email/resend-otp:
    post:
      operationId: authResendOtp
      summary: Resend email verification OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: OTP resent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/password/forgot:
    post:
      operationId: authForgotPassword
      summary: Request password reset OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "201":
          description: OTP sent if email exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/password/reset:
    post:
      operationId: authResetPassword
      summary: Reset password using OTP
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp, newPassword]
              properties:
                email:
                  type: string
                  format: email
                otp:
                  type: string
                  pattern: ^\d{6}$
                  example: "123456"
                newPassword:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ──────────────────────────────────────────────
  # USERS
  # ──────────────────────────────────────────────
  /users/me:
    get:
      operationId: usersGetProfile
      summary: Get current user profile
      tags: [Users]
      security:
        - access-token: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    patch:
      operationId: usersUpdateProfile
      summary: Update current user profile
      tags: [Users]
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileDto"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /users/me/onboarding:
    post:
      operationId: usersSaveOnboarding
      summary: Save onboarding answers
      tags: [Users]
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertOnboardingDto"
      responses:
        "201":
          description: Onboarding answers saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /users/search:
    get:
      operationId: usersSearch
      summary: Search users by username or name
      tags: [Users]
      security:
        - access-token: []
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Search query
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /users/{id}:
    get:
      operationId: usersGetById
      summary: Get user by ID
      tags: [Users]
      security:
        - access-token: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ──────────────────────────────────────────────
  # TREKS
  # ──────────────────────────────────────────────
  /treks:
    post:
      operationId: treksCreate
      summary: Create a trek (organizer only)
      tags: [Treks]
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTrekDto"
      responses:
        "201":
          description: Created trek
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    get:
      operationId: treksList
      summary: List and search treks
      tags: [Treks]
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: Full-text search query
        - in: query
          name: state
          schema:
            type: string
          description: Filter by state
        - in: query
          name: difficulty
          schema:
            $ref: "#/components/schemas/TrekDifficulty"
          description: Filter by difficulty
        - in: query
          name: minCost
          schema:
            type: integer
            minimum: 0
          description: Minimum cost filter
        - in: query
          name: maxCost
          schema:
            type: integer
            minimum: 0
          description: Maximum cost filter
        - in: query
          name: sort
          schema:
            type: string
            enum: [relevance, newest, popular, distance]
          description: Sort order
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          description: Items per page
      responses:
        "200":
          description: Paginated trek list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /treks/nearby:
    get:
      operationId: treksNearby
      summary: Find treks near a location
      tags: [Treks]
      parameters:
        - in: query
          name: latitude
          required: true
          schema:
            type: number
          description: Latitude coordinate
        - in: query
          name: longitude
          required: true
          schema:
            type: number
          description: Longitude coordinate
        - in: query
          name: radiusMeters
          schema:
            type: integer
            minimum: 10
            default: 5000
          description: Search radius in meters
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Treks near the provided coordinates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /treks/recommendations:
    get:
      operationId: treksRecommendations
      summary: Get trek recommendations
      tags: [Treks]
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
          description: Number of recommendations
        - in: query
          name: lat
          schema:
            type: number
          description: User latitude for geo-aware recs
        - in: query
          name: lon
          schema:
            type: number
          description: User longitude for geo-aware recs
      responses:
        "200":
          description: Recommended treks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /treks/{id}:
    get:
      operationId: treksGet
      summary: Get trek details by ID
      tags: [Treks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Trek ID
      responses:
        "200":
          description: Trek details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ──────────────────────────────────────────────
  # BOOKINGS
  # ──────────────────────────────────────────────
  /bookings:
    post:
      operationId: bookingsCreate
      summary: Create a booking
      tags: [Bookings]
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingDto"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
    get:
      operationId: bookingsList
      summary: List my bookings
      tags: [Bookings]
      security:
        - access-token: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: User's bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /bookings/verify:
    post:
      operationId: bookingsVerify
      summary: Verify a booking QR token
      tags: [Bookings]
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qrToken]
              properties:
                qrToken:
                  type: string
                  description: QR token from booking ticket
      responses:
        "201":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /bookings/release-expired:
    patch:
      operationId: bookingsReleaseExpired
      summary: Release expired booking holds (admin only)
      tags: [Bookings]
      security:
        - access-token: []
      responses:
        "200":
          description: Expired holds released
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /bookings/{id}:
    get:
      operationId: bookingsGet
      summary: Get booking detail
      tags: [Bookings]
      security:
        - access-token: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /bookings/{id}/cancel:
    post:
      operationId: bookingsCancel
      summary: Cancel a booking
      tags: [Bookings]
      security:
        - access-token: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Cancellation reason
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /bookings/{id}/ticket:
    get:
      operationId: bookingsTicket
      summary: Download booking ticket PDF
      tags: [Bookings]
      security:
        - access-token: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: PDF ticket file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # ──────────────────────────────────────────────
  # PAYMENTS
  # ──────────────────────────────────────────────
  /payments/checkout:
    post:
      operationId: paymentsCheckout
      summary: Create a payment checkout session
      tags: [Payments]
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutDto"
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /payments/webhook/{provider}:
    post:
      operationId: paymentsWebhook
      summary: Handle payment provider webhook (Stripe / Razorpay)
      tags: [Payments]
      parameters:
        - in: path
          name: provider
          required: true
          schema:
            type: string
            enum: [stripe, razorpay]
          description: Payment provider slug
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Raw webhook payload from provider
      responses:
        "200":
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  received:
                    type: boolean
                    example: true

  # ──────────────────────────────────────────────
  # MEDIA
  # ──────────────────────────────────────────────
  /media/presign:
    post:
      operationId: mediaPresign
      summary: Get presigned upload URL for any media category
      tags: [Media]
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignDto"
      responses:
        "201":
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /media/presign/profile:
    post:
      operationId: mediaPresignProfile
      summary: Get presigned URL for profile image
      tags: [Media]
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignDto"
      responses:
        "201":
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /media/presign/banner:
    post:
      operationId: mediaPresignBanner
      summary: Get presigned URL for banner image
      tags: [Media]
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignDto"
      responses:
        "201":
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /media/presign/post:
    post:
      operationId: mediaPresignPost
      summary: Get presigned URL for post image
      tags: [Media]
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignDto"
      responses:
        "201":
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /media/presign/trek:
    post:
      operationId: mediaPresignTrek
      summary: Get presigned URL for trek image
      tags: [Media]
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignDto"
      responses:
        "201":
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /media/presign/story:
    post:
      operationId: mediaPresignStory
      summary: Get presigned URL for story media
      tags: [Media]
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignDto"
      responses:
        "201":
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ──────────────────────────────────────────────
  # ASSESSMENTS
  # ──────────────────────────────────────────────
  /assessments/questions:
    get:
      operationId: assessmentsGetQuestions
      summary: Get quiz questions and options
      tags: [Assessments]
      responses:
        "200":
          description: Returns the quiz question bank
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /assessments/submit:
    post:
      operationId: assessmentsSubmit
      summary: Submit quiz answers and get score + bracket
      tags: [Assessments]
      security:
        - access-token: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAssessmentDto"
      responses:
        "201":
          description: Assessment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResultDto"

  /assessments/my-result:
    get:
      operationId: assessmentsMyResult
      summary: Get latest assessment result for current user
      tags: [Assessments]
      security:
        - access-token: []
      responses:
        "200":
          description: Latest assessment result or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResultDto"

  /users/{userId}/assessment-result:
    get:
      operationId: assessmentsUserBracket
      summary: Get a user public assessment bracket
      tags: [Assessments]
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User public difficulty bracket
          content:
            application/json:
              schema:
                type: object
                properties:
                  difficultyBracket:
                    type: string
                    nullable: true

  # ──────────────────────────────────────────────
  # BOOKMARKS
  # ──────────────────────────────────────────────
  /bookmarks:
    get:
      operationId: bookmarksList
      summary: List my bookmarked treks
      tags: [Bookmarks]
      security:
        - access-token: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated bookmarks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /bookmarks/treks/{trekId}:
    post:
      operationId: bookmarksToggle
      summary: Toggle bookmark on a trek
      tags: [Bookmarks]
      security:
        - access-token: []
      parameters:
        - in: path
          name: trekId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Bookmark toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  # ──────────────────────────────────────────────
  # FRIENDSHIPS
  # ──────────────────────────────────────────────
  /friend-requests:
    post:
      operationId: friendshipsSendRequest
      summary: Send a friend request
      tags: [Friendships]
      security:
        - access-token: []
      requestBody:
